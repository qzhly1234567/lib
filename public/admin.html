<!doctype html>
<html lang="zh-CN" data-admin="true"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信息空间</title><link rel="stylesheet" href="/styles.css"><script src="/fields.js" defer></script><script src="/app.js" defer></script></head><body><header class="topbar"><div class="nav"><div class="brand"><span class="logo"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="brand-name" id="brandName">信息空间</span></div><nav aria-label="业务导航"><button data-tab="suppliers">询价厂家信息</button><button data-tab="equipment">设备信息</button></nav><div class="nav-end"><span class="mode" id="mode">信息查询与收集</span><button class="theme" id="theme" aria-label="切换为日间主题">☀ 日间</button></div></div></header>
<main><p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p><div class="crumb" id="crumb" hidden><button id="crumbBack">← 返回列表</button><span>/</span><span id="crumbText"></span></div><div class="heading"><div><h1 id="title"></h1><p class="lead" id="lead"></p></div><div class="counter" id="counter"><strong id="total">0</strong><div>条记录<small>RECORDS</small></div></div></div>

<div id="listPage"><section class="panel filters" aria-label="筛选条件"><h2 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></svg>筛选条件</h2><form id="filterForm"><div class="filter-fields" id="filterFields"></div><div class="filter-bottom"><span class="hint"><i>⌕</i> 下拉精确匹配，其他条件模糊搜索</span><div class="buttons"><button class="secondary" id="reset" type="button">重置</button><button class="primary" type="submit" id="searchButton">查询</button></div></div></form></section><div class="table-bar"><div class="table-caption"><h2 id="listTitle"></h2><span id="resultCount"></span></div><button class="primary" id="addButton"></button></div><section class="panel table"><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><div class="empty" id="empty" role="status" aria-live="polite" hidden><strong>没有找到匹配的数据</strong><span>试试调整筛选条件，或重置后查看全部记录。</span></div><div class="table-foot"><span id="tableCount"></span><span id="tableNote">仅展示查询结果，不影响已保存的数据</span></div><div class="pager" aria-label="列表分页"><label for="pageSize">每页 <select id="pageSize" aria-label="每页条数"><option value="20">20 条</option><option value="50">50 条</option><option value="100">100 条</option></select></label><div class="page-buttons"><button class="secondary" id="firstPage" type="button" aria-label="首页">首页</button><button class="secondary" id="prevPage" type="button">上一页</button><span id="pageInfo" aria-live="polite">第 1 / 1 页</span><button class="secondary" id="nextPage" type="button">下一页</button><button class="secondary" id="lastPage" type="button" aria-label="末页">末页</button></div><form id="jumpForm"><label for="pageJump">跳至</label><input id="pageJump" type="number" min="1" step="1" required aria-label="跳转页码"><button class="secondary" type="submit" id="jumpButton">确定</button></form></div></section></div>
<div id="formPage" hidden><div class="form-layout"><section class="panel form-panel"><div class="form-title"><span class="form-icon" id="formIcon">＋</span><div><h2 id="formTitle"></h2><p>请填写以下内容，带 * 的为必填项</p></div></div><form id="entryForm"><div class="form-fields" id="formFields"></div><p class="error" id="formError" role="alert" hidden></p><div class="form-actions"><span class="hint">ⓘ 提交前请确认信息准确无误</span><div class="buttons"><button class="secondary" id="cancel" type="button">取消</button><button class="primary" id="submit" type="submit">提交信息 ↗</button></div></div></form></section><aside class="panel side"><h3>填写说明</h3><p>带 * 的字段为必填项</p><p>备注可补充其他说明</p><p>提交后可返回列表查看</p><div class="side-divider"></div><div class="info" id="formTips"></div></aside></div></div>
<footer><span>信息空间 <span style="opacity:.4;margin:0 8px">/</span> INFORMATION SPACE</span><span>信息有序，查询有据。</span></footer></main>
<dialog id="successDialog" aria-labelledby="successTitle"><div class="success"><div class="check">✓</div><h2 id="successTitle">提交成功</h2><p id="successText"></p><div class="buttons"><button class="secondary" id="returnList">返回列表</button><button class="primary" id="continueAdd">继续添加</button></div></div></dialog>
<dialog id="deleteDialog" aria-labelledby="deleteTitle"><h2 id="deleteTitle">确认删除这条记录？</h2><p>即将删除「<strong id="deleteName"></strong>」，此操作无法撤销。</p><p id="deleteError" class="error" role="alert" hidden></p><div class="dialog-actions"><button class="secondary" id="deleteCancel">取消</button><button class="delete-confirm" id="deleteConfirm">确认删除</button></div></dialog><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body></html>
