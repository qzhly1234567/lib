function buildForm(row){$('formFields').replaceChildren();for(const field of schemas[entity].fields){const group=document.createElement('div'),label=document.createElement('label'),input=document.createElement(field.textarea?'textarea':'input');if(field.wide)group.className='wide';label.htmlFor='input-'+field.key;label.textContent=field.label;if(field.required){const star=document.createElement('span');star.className='required';star.textContent='*';label.append(star)}input.id='input-'+field.key;input.name=field.key;input.required=Boolean(field.required);input.placeholder=field.placeholder;input.maxLength=field.textarea?1000:200;if(!field.textarea)input.type=field.type||'text';if(field.type==='number'){input.min='0';input.step='0.01'}input.value=row?.[field.key]??'';group.append(label,input);if(field.hint){const hint=document.createElement('div');hint.className='field-hint';hint.textContent=field.hint;group.append(hint)}$('formFields').append(group)}$('formError').hidden=true}
function makeCell(text,className){const td=document.createElement('td');td.textContent=text;if(className)td.className=className;return td}
function renderRows(){const s=schemas[entity],active=query[entity];const filtered=data[entity].filter(r=>Object.entries(active).every(([k,value])=>String(r[k]??'').toLocaleLowerCase().includes(value.toLocaleLowerCase())));$('head').replaceChildren();for(const text of ['序号',...s.fields.map(f=>f.label),...(admin?['操作']:[])]){const th=document.createElement('th');th.scope='col';th.textContent=text;$('head').append(th)}$('rows').replaceChildren();for(const [index,row]of filtered.entries()){const tr=document.createElement('tr');tr.append(makeCell(String(index+1).padStart(2,'0')));for(const [i,f]of s.fields.entries()){const value=row[f.key],td=makeCell(value||'—',f.key==='remark'?'remark':f.key==='price'?'money':'');if(i===0){const tag=document.createElement('span');tag.className='tag';tag.textContent=value||'—';td.replaceChildren(tag)}if(f.key==='price'&&value!=='')td.textContent=Number(value).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});tr.append(td)}if(admin){const td=makeCell('');for(const [text,kind]of [['编辑','edit'],['删除','delete']]){const b=document.createElement('button');b.className='row-action'+(kind==='delete'?' danger':'');b.textContent=text;b.setAttribute('aria-label',text+row.name);b.onclick=()=>{if(kind==='edit')navigate(entity,'edit',row.id);else{deleteId=row.id;$('deleteName').textContent=row.name;$('deleteDialog').showModal()}};td.append(b)}tr.append(td)}$('rows').append(tr)}$('empty').hidden=filtered.length>0;$('total').textContent=data[entity].length;$('resultCount').textContent=Object.keys(active).length?'筛选后 '+filtered.length+' 条':'共 '+filtered.length+' 条记录';$('resultCount').className=Object.keys(active).length?'active-filter':'';$('tableCount').textContent='当前显示 '+filtered.length+' 条 / 全部 '+data[entity].length+' 条';$('tableNote').textContent=admin?'编辑和删除将影响所有使用者':'仅展示查询结果，不影响已保存的数据'}
function route(){window.scrollTo(0,0);searchVersion++;$('searchButton').disabled=false;$('searchButton').textContent='查询';const parts=location.hash.slice(1).split('/');entity=Object.hasOwn(schemas,parts[0])?parts[0]:'suppliers';view=['add','edit'].includes(parts[1])?parts[1]:'list';editId=admin&&view==='edit'?Number(parts[2]):null;if(view==='edit'&&!admin)view='list';const row=editId!==null?data[entity].find(r=>r.id===editId):null;if(view==='edit'&&!row){navigate(entity);return}const s=schemas[entity],form=view!=='list',editing=view==='edit';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===entity));$('listPage').hidden=form;$('formPage').hidden=!form;$('crumb').hidden=!form;$('counter').hidden=form;$('title').textContent=form?(editing?'编辑'+s.short+'信息':s.add):s.title;$('lead').textContent=form?(editing?'更新记录内容，保存后将同步至列表。':'完善'+s.short+'信息，提交后可继续添加或返回列表。'):s.description;$('crumbText').textContent=editing?'编辑信息':s.add;$('listTitle').textContent=s.short+'信息列表';$('addButton').textContent='＋ '+s.add;$('formTitle').textContent=editing?'编辑'+s.short+'信息':s.add;$('formIcon').textContent=editing?'✎':'＋';$('submit').textContent=editing?'保存修改':'提交信息 ↗';$('formTips').textContent=entity==='suppliers'?'系统、设备名称、品牌（供货厂家）、联系人和联系电话必填。':'设备分类、设备名称必填，其余字段可按实际情况填写。';buildFilters();if(form)buildForm(row);renderRows();document.title=(admin?'管理 · ':'')+(form?$('title').textContent:s.title)+' · 设计稿'}
$('filterForm').onsubmit=async event=>{event.preventDefault();const version=++searchVersion,selected=entity,conditions={};for(const f of schemas[entity].fields.filter(f=>f.key!=='remark')){const value=$('filter-'+f.key).value.trim();if(value)conditions[f.key]=value}$('searchButton').disabled=true;$('searchButton').textContent='查询中…';await new Promise(r=>setTimeout(r,250));if(version!==searchVersion||selected!==entity)return;query[entity]=conditions;renderRows();$('searchButton').disabled=false;$('searchButton').textContent='查询'};
$('reset').onclick=()=>{searchVersion++;query[entity]={};buildFilters();renderRows();$('searchButton').disabled=false;$('searchButton').textContent='查询'};
$('addButton').onclick=()=>navigate(entity,'add');$('crumbBack').onclick=$('cancel').onclick=()=>navigate(entity);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));
$('entryForm').onsubmit=async event=>{event.preventDefault();if(busy)return;const s=schemas[entity],record={};for(const field of s.fields){const value=$('input-'+field.key).value.trim();if(field.required&&!value){$('formError').textContent='请填写'+field.label;$('formError').hidden=false;return}if(field.type==='number'&&value!==''&&(!Number.isFinite(Number(value))||Number(value)<0||!/^\d+(?:\.\d{1,2})?$/.test(value))){$('formError').textContent='购置单价请输入非负金额，最多两位小数。';$('formError').hidden=false;return}record[field.key]=value}busy=true;$('submit').disabled=true;$('cancel').disabled=true;$('submit').textContent='正在提交…';await new Promise(r=>setTimeout(r,450));if(view==='edit'){Object.assign(data[entity].find(r=>r.id===editId),record);busy=false;toast('修改已保存');navigate(entity)}else{data[entity].push({...record,id:nextId++});$('successText').textContent=s.short+'信息已保存，你可以返回列表查看，或继续添加下一条。';$('successDialog').showModal();busy=false}$('submit').disabled=false;$('cancel').disabled=false;$('submit').textContent=view==='edit'?'保存修改':'提交信息 ↗'};
$('returnList').onclick=()=>{$('successDialog').close();query[entity]={};navigate(entity)};$('continueAdd').onclick=()=>{$('successDialog').close();$('entryForm').reset();$('formError').hidden=true;$('formFields').querySelector('input').focus();toast('表单已清空，可继续添加')};$('successDialog').addEventListener('cancel',e=>e.preventDefault());
$('deleteCancel').onclick=()=>$('deleteDialog').close();$('deleteConfirm').onclick=()=>{data[entity]=data[entity].filter(r=>r.id!==deleteId);$('deleteDialog').close();renderRows();toast('记录已删除')};window.addEventListener('hashchange',route);route();
</script></body></html>
